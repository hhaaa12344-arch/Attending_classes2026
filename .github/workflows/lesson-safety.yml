name: Lesson and attendance safety
on:
  pull_request:
  push:
    branches: [fix/verified-lessons-attendance-safety]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: attendance_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attendance_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Isolated embedded PostgreSQL tests
        run: npm test
      - name: Native PostgreSQL transaction and concurrency tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/attendance_test_ci
